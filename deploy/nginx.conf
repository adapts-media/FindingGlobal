# nginx sits in front of the Node app: it terminates TLS (certbot adds that block), compresses
# responses, and serves hashed build assets with long cache lifetimes. Everything else —
# pages, /api, /sitemap.xml — is proxied to Express on 127.0.0.1:4000, which does the
# prerendered-page + fresh-WordPress-meta handling itself. setup-vps.sh replaces __DOMAIN__.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__ www.__DOMAIN__;

  # Canonical host is the bare domain (see the canonical tags the app emits).
  if ($host = www.__DOMAIN__) {
    return 301 $scheme://__DOMAIN__$request_uri;
  }

  client_max_body_size 6m; # the API accepts up to 5mb JSON bodies

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Vite output filenames are content-hashed, so they can be cached forever.
  location /assets/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # the app trusts exactly one proxy hop
    proxy_set_header X-Forwarded-Proto $scheme;                  # the app's HTTP->HTTPS redirect reads this
    proxy_read_timeout 60s;
  }
}
