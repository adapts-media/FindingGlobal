    <!--
      No title, description, or robots tag here on purpose: every route supplies its own via
      head() (see src/routes/__root.tsx for the site-wide fallback), and TanStack Router's
      HeadContent component renders exactly one of each from the merged route matches. A
      static default here would just sit alongside that one, un-deduped, as a second title or
      meta tag. Note for future edits: never type an opening angle bracket followed by a tag
      name in this comment, spelled out plainly or not -- scripts/prerender.js and
      server/src/lib/seo.js post-process this file with regexes that don't understand HTML
      comments, so that text can get matched as if it were real markup.
    -->

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.ico" />

      "@context": "https://schema.org",
